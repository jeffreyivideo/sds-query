<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>危害性化學品 SDS 查詢</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      :root { --primary-color: #0061ff; --secondary-color: #2c3e50; --danger-color: #ff4757; --success-color: #2ed573; --warning-color: #f39c12; --text-color: #2f3542; }
      * { box-sizing: border-box; }
      body { font-family: 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif; margin: 0; padding: 40px 15px; min-height: 100vh; background: linear-gradient(135deg, rgba(0, 97, 255, 0.1) 0%, rgba(0, 0, 0, 0.05) 100%), url('https://images.unsplash.com/photo-1544161513-0179fe746fd5?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; background-position: center; display: flex; justify-content: center; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
      .container { width: 100%; max-width: 650px; }
      .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 35px 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); }
      .title-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; }
      .title-container img { height: 45px; width: auto; }
      .title-container h2 { color: var(--secondary-color); margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 2px; }
      .select-box { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
      select { width: 100%; padding: 18px; font-size: 20px; border: 2px solid #ddd; border-radius: 12px; background-color: #fff; color: var(--text-color); cursor: pointer; transition: all 0.3s ease; }
      select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0,97,255,0.1); }
      .search-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #0061ff 0%, #60efff 100%); color: white; border: none; border-radius: 12px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 15px rgba(0, 97, 255, 0.2); transition: transform 0.2s; }
      .search-btn:active { transform: scale(0.98); }
      .result-summary { margin-top: 30px; padding: 25px; background: #f8faff; border-radius: 16px; border-left: 6px solid var(--primary-color); display: none; animation: slideIn 0.4s ease-out; }
      @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .info-row { margin-bottom: 15px; font-size: 18px; line-height: 1.6; color: var(--text-color); }
      .res-name-title { font-size: 24px; color: var(--secondary-color); margin-bottom: 20px; display: block; border-bottom: 2px solid #eee; padding-bottom: 10px; }
      .expiry-tag { color: var(--danger-color); font-weight: 800; font-size: 20px; }
      .enlarge-btn { width: 100%; margin-top: 20px; padding: 20px; background-color: var(--success-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 6px 12px rgba(46, 213, 115, 0.2); }
      #pdfModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; flex-direction: column; }
      .modal-header { padding: 20px; background: var(--secondary-color); color: white; display: flex; align-items: center; }
      .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: bold; }
      .modal-body { flex: 1; width: 100%; }
      iframe { width: 100%; height: 100%; border: none; }
      /* 載入動畫 */
      #loader { text-align: center; color: var(--primary-color); font-weight: bold; display: none; margin-bottom: 20px;}
    </style>
  </head>
  <body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" onpaste="return false;">

    <div class="container">
      <div class="card">
        <div class="title-container">
          <!-- 請將下方 src 替換為您的信實 Logo Base64 亂碼 -->
          <img src="data:image/png;base64,在此貼上您的Logo_Base64代碼" alt="信實Logo">
          <h2 id="pageTitle">危害性化學品 SDS 查詢</h2>
        </div>

        <div id="loader">資料載入中，請稍候...</div>

        <div class="select-box">
          <select id="sdsSelect">
            <option value="" disabled selected>請點選選擇化學品...</option>
          </select>
          <button class="search-btn" onclick="doQuery()">
            <span class="material-icons">search</span> 立即查詢
          </button>
        </div>

        <div id="resultSummary" class="result-summary">
          <b id="resName" class="res-name-title"></b>
          <div class="info-row">
            <span class="material-icons" style="vertical-align: middle; margin-right: 8px; color: var(--danger-color);">warning</span>
            有效到期日：<span id="resExpiry" class="expiry-tag"></span>
          </div>
          <button class="enlarge-btn" onclick="openModal()">
            <span class="material-icons" style="font-size: 28px;">fullscreen</span> 放大查看安全資料表
          </button>
        </div>
      </div>
    </div>

    <div id="pdfModal">
      <div class="modal-header">
        <button class="back-btn" onclick="closeModal()">
          <span class="material-icons">arrow_back</span> 返回搜尋
        </button>
        <span id="modalTitle" style="margin-left: 20px; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
      </div>
      <div class="modal-body">
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>

    <script>
      // ！！！請將下方引號內的網址替換為您的 Apps Script API 網址！！！
      const API_URL = "https://script.google.com/macros/s/AKfycbxsmlxNt4S0oN6WeY4vkL920r31mkCBx8yCTiMKxLj5k761t_6K3MG96iITgPwyVMgsXw/exec"; 
      
      let allSdsData = [];
      let currentFileId = "";

      window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetLoc = urlParams.get('loc') || "ALL";

        if (targetLoc !== "ALL") {
          document.getElementById('pageTitle').innerText = targetLoc + " - SDS 查詢";
        }

        document.getElementById('loader').style.display = 'block';

        // 透過 API 抓取 Google Sheets 資料
        fetch(API_URL)
          .then(response => response.json())
          .then(data => {
            document.getElementById('loader').style.display = 'none';
            
            // 進行分區過濾
            allSdsData = targetLoc === "ALL" ? data : data.filter(item => item.location.includes(targetLoc));
            const select = document.getElementById('sdsSelect');
            
            if (allSdsData.length === 0) {
              select.options[0].text = "此區域尚無化學品紀錄";
              return;
            }

            const names = [...new Set(allSdsData.map(item => item.name))].sort();
            names.forEach(name => {
              const option = document.createElement('option');
              option.value = name;
              option.text = name;
              select.appendChild(option);
            });
          })
          .catch(error => {
            console.error("載入失敗:", error);
            document.getElementById('loader').innerText = "載入失敗，請重新整理網頁";
          });
      };

      function doQuery() {
        const selectedName = document.getElementById('sdsSelect').value;
        if (!selectedName) return;
        const item = allSdsData.find(i => i.name === selectedName);
        if (item) {
          document.getElementById('resName').innerText = item.name;
          document.getElementById('resExpiry').innerText = item.expiryDate;
          document.getElementById('modalTitle').innerText = "查看：" + item.name;
          currentFileId = item.fileId;
          document.getElementById('resultSummary').style.display = 'block';
        }
      }

      function openModal() {
        const previewUrl = "https://drive.google.com/file/d/" + currentFileId + "/preview";
        document.getElementById('pdfFrame').src = previewUrl;
        document.getElementById('pdfModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        document.getElementById('pdfModal').style.display = 'none';
        document.getElementById('pdfFrame').src = "";
        document.body.style.overflow = 'auto';
      }
    </script>
  </body>
</html>
